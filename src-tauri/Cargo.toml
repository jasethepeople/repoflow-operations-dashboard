[package]
name = "repoflow"
version = "0.1.0"
description = "RepoFlow Operations Dashboard"
authors = ["Jason Clark"]
edition = "2021"

[lib]
name = "repoflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
